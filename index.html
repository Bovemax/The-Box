<!DOCTYPE html>
<html lang="en">

<head>
    <title>The Box</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="game">
        <div id="textbox">
            <p id="textbox-text"></p>
            <p id="down-arrow">▼</p>
        </div>
        <div id="game-over">
            <div class="game-over-content">
                <p id="game-over-text">Game Over</p>
                <p id="high-score-text">High Score: 0</p>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
        <p id="score"></p>
        <img draggable="false" id="box" alt="The Box" src="assets/box.png" />
        <canvas id="durability-bar"></canvas>
    </div>

    <script src="index.js"></script>
</body>

</html>
